<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment — Tiffany Vargas Tattoo</title>
    <meta name="description" content="Submit an inquiry or appointment request to Tiffany Vargas, New Jersey tattoo artist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">tiffany vargas</a>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="aftercare.html">Aftercare</a></li>
                    <li><a href="consent.html">Consent Forms</a></li>
                    <li><a href="contact.html" class="nav-cta active">Book Now</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Book an Appointment</h1>
            <p>Submit your inquiry and appointment request</p>
        </div>
    </section>

    <section class="section">
        <div class="container content-narrow">
            <form class="contact-form" name="contact" method="POST" netlify>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="preferred-date">Preferred Date</label>
                        <input type="date" id="preferred-date" name="preferred-date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="tattoo-description">Tattoo Description *</label>
                    <textarea id="tattoo-description" name="tattoo-description" rows="4" placeholder="Describe the design you want, size, placement, and any specific details" required></textarea>
                </div>

                <div class="form-group">
                    <label for="message">Additional Message</label>
                    <textarea id="message" name="message" rows="3" placeholder="Any other questions or comments?"></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="consent-agree" name="consent-agree" required>
                    <label for="consent-agree">I have reviewed and agree to the consent forms and aftercare instructions</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Submit Request</button>
            </form>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Tiffany Vargas Tattoo · New Jersey</p>
            <p class="footer-links">
                <a href="portfolio.html">Portfolio</a> ·
                <a href="faq.html">FAQ</a> ·
                <a href="aftercare.html">Aftercare</a> ·
                <a href="consent.html">Consent Forms</a> ·
                <a href="contact.html">Book</a>
            </p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
