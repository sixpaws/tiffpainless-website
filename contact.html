<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment — Tiff Painless Tattoo</title>
    <meta name="description" content="Submit an inquiry or appointment request to Tiff Painless, New Jersey tattoo artist.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Tiff Painless</a>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="aftercare.html">Aftercare</a></li>
                    <li><a href="consent.html">Consent Forms</a></li>
                    <li><a href="contact.html" class="nav-cta active">Book Now</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Book an Appointment</h1>
            <p>Tell me about your idea and I'll get back to you within 2–3 business days.</p>
        </div>
    </section>

    <section class="section">
        <div class="container content-narrow">
            <!--
                FORM SUBMISSION SETUP:
                This form currently uses a placeholder action. To make it functional, you have two options:

                OPTION 1 — Use a form service (easiest, no code needed):
                1. Sign up at https://formspree.io (free tier available)
                2. Create a form and copy your form endpoint URL
                3. Replace the form action below with your Formspree URL:
                   action="https://formspree.io/f/yourformid"

                OPTION 2 — Use a backend service:
                Set up a backend server to handle form submissions and update the form action accordingly.
            -->
            <form class="contact-form" method="POST" action="/send-message">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="preferred-date">Preferred Date</label>
                        <input type="date" id="preferred-date" name="preferred-date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="design-idea">Design Idea *</label>
                    <textarea id="design-idea" name="design-idea" rows="4" placeholder="Describe your tattoo idea, style, size, and placement." required></textarea>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes</label>
                    <textarea id="message" name="message" rows="3" placeholder="Anything else I should know?"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-large">Send Inquiry</button>
            </form>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> Tiff Painless Tattoo | New Jersey</p>
            <p>
                <a href="contact.html" class="btn btn-primary btn-small">Book Now</a>
            </p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
