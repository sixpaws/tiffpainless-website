<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consent Forms — Tiff Painless Tattoo</title>
    <meta name="description" content="Tattoo consent forms and information for clients of Tiff Painless, New Jersey.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .consent-intro {
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 1.08rem;
        }

        .consent-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 20px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .consent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .consent-header h2 {
            margin: 0;
            font-size: 1.7rem;
            color: var(--accent);
        }

        .consent-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .consent-embed {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            min-height: 900px;
        }

        .consent-embed iframe {
            width: 100%;
            min-height: 900px;
            display: block;
            border: 0;
            background: #fff;
        }

        @media (max-width: 768px) {
            .consent-card {
                padding: 16px 12px 12px;
            }

            .consent-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .consent-header h2 {
                font-size: 1.4rem;
            }

            .consent-embed,
            .consent-embed iframe {
                min-height: 820px;
            }
        }
    </style>
</head>

                </ul>
            </nav>
        </div>
    </header>
